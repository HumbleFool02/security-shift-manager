<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://kit.fontawesome.com/7cf8b731c0.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
        integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dash.css') }}?v={{ STATIC_VERSION }}">
    <title>Dashboard</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.svg') }}">
</head>

<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="container mt-3">
        {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}
    <div class="header" id="topheader">
        <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
            <div class="container text-uppercase p-2">
                <a class="navbar-brand" href="/index"><i class="fa-solid fa-eye"></i> HAWK EYE</a>
                <button class="navbar-toggler" type="button" data-toggle="collapse"
                    data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item ">
                            <a class="nav-link active" href="/index">Home <span class="sr-only">(current)</span></a>
                        </li>
                        <li class="nav-item ">
                            <a class="nav-link active" href="/managerdash">Dashboard <span class="sr-only">(current)</span></a>
                        </li>
                        <li class="nav-item ">
                            <a class="nav-link active" href="/logout">Logout<span class="sr-only">(current)</span></a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>
    <div class="card" style="margin-top: 32px;">
        <h3>Create Routine</h3>
        <form action="" method="post">
            <div class="form-row">
                <div class="col-lg-4 col-4">
                    <label>Select Security Person</label>
                    <select name="didno" class="form-control" required>
                        {% for secu in security %}
                        <option value="{{ secu.idno }}">{{ secu.name }} ({{ secu.idno }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="col-lg-4 col-4">
                    <label>Select Place</label>
                    <select name="placeid" class="form-control" required>
                        {% for place in places %}
                        <option value="{{ place.id }}">{{ place.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="col-lg-4 col-4">
                    <label>Enter Duty Date</label>
                    <input type="date" placeholder="Duty Date" name="ddate" value="" class="form-control"
                        my-3 p-3 required />
                </div>
            </div>
            <div class="form-row">
                <div class="col-lg-4 col-4">
                    <label>Select Shift</label>
                    <select name="shift" class="form-control" required>
                        {% for shift in SHIFTS %}
                        <option value="{{ shift }}">{{ shift }} ({{ SHIFT_TIMES[shift][0] }}-{{ SHIFT_TIMES[shift][1] }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="col-lg-4 col-4">
                    <button type="submit" class="btn btn-primary" name="button"
                        onclick="msg()">Submit</button>
                </div>
            </div>
        </form>
    </div>


    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx"
        crossorigin="anonymous"></script>
    <script>
        function msg() {
            alert("Sucessfully Created Routine");
        }
    </script>
</body>

</html>
